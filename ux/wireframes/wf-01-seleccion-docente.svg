<text x="410" y="50" font-size="16" font-weight="bold" fill="#2b2b30">WF-01 · Paso 1: asignatura y docente</text>
<text x="410" y="72" font-size="12" fill="#6b6b75">Baja fidelidad · móvil 360 px · mobile first</text>
<circle cx="419" cy="106" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="110" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">1</text>
<text x="436" y="110" font-size="12" fill="#2b2b30">Selector nativo con etiqueta visible. Al</text>
<text x="436" y="126" font-size="12" fill="#2b2b30">cambiar, la lista de docentes se filtra</text>
<text x="436" y="142" font-size="12" fill="#2b2b30">sin recargar.</text>
<circle cx="419" cy="172" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="176" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">2</text>
<text x="436" y="176" font-size="12" fill="#2b2b30">Búsqueda opcional que ignora tildes. Se</text>
<text x="436" y="192" font-size="12" fill="#2b2b30">anuncia cuántos docentes se encontraron.</text>
<circle cx="419" cy="222" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="226" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">3</text>
<text x="436" y="226" font-size="12" fill="#2b2b30">Docentes como tarjetas de opción (radio).</text>
<text x="436" y="242" font-size="12" fill="#2b2b30">Muestran asignaturas, modalidades y días</text>
<text x="436" y="258" font-size="12" fill="#2b2b30">para decidir sin abrir otra pantalla.</text>
<circle cx="419" cy="288" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="292" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">4</text>
<text x="436" y="292" font-size="12" fill="#2b2b30">Si la búsqueda no encuentra nada: mensaje</text>
<text x="436" y="308" font-size="12" fill="#2b2b30">+ botón para borrar la búsqueda</text>
<text x="436" y="324" font-size="12" fill="#2b2b30">(recuperación del error).</text>
<circle cx="419" cy="354" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="358" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">5</text>
<text x="436" y="358" font-size="12" fill="#2b2b30">Botón principal de ancho completo, mínimo</text>
<text x="436" y="374" font-size="12" fill="#2b2b30">44 px de alto. Si falta algo, aparece un</text>
<text x="436" y="390" font-size="12" fill="#2b2b30">resumen de errores arriba.</text>
</svg>