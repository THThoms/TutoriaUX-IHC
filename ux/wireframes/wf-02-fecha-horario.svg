<text x="410" y="50" font-size="16" font-weight="bold" fill="#2b2b30">WF-02 · Paso 2: modalidad, fecha y hora</text>
<text x="410" y="72" font-size="12" fill="#6b6b75">Baja fidelidad · móvil 360 px · mobile first</text>
<circle cx="419" cy="106" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="110" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">1</text>
<text x="436" y="110" font-size="12" fill="#2b2b30">Solo se muestran las modalidades que</text>
<text x="436" y="126" font-size="12" fill="#2b2b30">ofrece el docente; si es una sola, queda</text>
<text x="436" y="142" font-size="12" fill="#2b2b30">marcada y se explica por qué.</text>
<circle cx="419" cy="172" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="176" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">2</text>
<text x="436" y="176" font-size="12" fill="#2b2b30">Fecha limitada de hoy a 30 días. La ayuda</text>
<text x="436" y="192" font-size="12" fill="#2b2b30">recuerda los días de atención (reconocer</text>
<text x="436" y="208" font-size="12" fill="#2b2b30">antes que recordar).</text>
<circle cx="419" cy="238" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="242" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">3</text>
<text x="436" y="242" font-size="12" fill="#2b2b30">Horarios como opciones grandes con inicio</text>
<text x="436" y="258" font-size="12" fill="#2b2b30">y fin. Los ocupados se ven pero están</text>
<text x="436" y="274" font-size="12" fill="#2b2b30">deshabilitados y dicen “Ocupado” (no solo</text>
<text x="436" y="290" font-size="12" fill="#2b2b30">color).</text>
<circle cx="419" cy="320" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="324" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">4</text>
<text x="436" y="324" font-size="12" fill="#2b2b30">Recuperación del error: el mensaje</text>
<text x="436" y="340" font-size="12" fill="#2b2b30">explica qué días sí atiende para elegir</text>
<text x="436" y="356" font-size="12" fill="#2b2b30">otra fecha sin adivinar.</text>
<circle cx="419" cy="386" r="9" fill="#fff3b0" stroke="#8a6d00" stroke-width="1.5"/>
<text x="419" y="390" font-size="10" font-weight="bold" fill="#5a4700" text-anchor="middle">5</text>
<text x="436" y="390" font-size="12" fill="#2b2b30">Volver no borra nada: todo se guarda como</text>
<text x="436" y="406" font-size="12" fill="#2b2b30">borrador en cada cambio.</text>
