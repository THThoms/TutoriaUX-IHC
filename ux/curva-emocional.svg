<text x="802.5" y="449" font-size="12" text-anchor="middle" fill="#1d1d1f">y ve código</text>
<text x="802.5" y="470" font-size="11" text-anchor="middle" fill="#7a4b00" font-weight="bold">TP4 · MC2</text>
<text x="916.2" y="434" font-size="12" text-anchor="middle" fill="#1d1d1f">Necesita</text>
<text x="916.2" y="449" font-size="12" text-anchor="middle" fill="#1d1d1f">cambiar/cancelar</text>
<text x="916.2" y="470" font-size="11" text-anchor="middle" fill="#7a4b00" font-weight="bold">TP5 · MC2</text>
<text x="1030.0" y="434" font-size="12" text-anchor="middle" fill="#1d1d1f">Asiste a la</text>
<text x="1030.0" y="449" font-size="12" text-anchor="middle" fill="#1d1d1f">tutoría</text>
<text x="1030.0" y="470" font-size="11" text-anchor="middle" fill="#7a4b00" font-weight="bold">Después</text>
