<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Curva emocional del proceso de reserva de tutorías</title>
<desc id="d">Compara la emoción del estudiante en 9 etapas: proceso actual sin sistema (línea punteada) y con Tutoría UX v1 (línea continua). Los puntos más bajos son elegir fecha y hora y corregir un error.</desc>
<rect width="1100" height="560" fill="#ffffff"/>
<text x="40" y="40" font-size="20" font-weight="bold" fill="#1d1d1f">Curva emocional · Reserva de tutoría</text>
<text x="40" y="62" font-size="13" fill="#4a4a52">Escala de -2 (frustración) a +2 (satisfacción). MC = momento crítico, TP = touchpoint.</text>
