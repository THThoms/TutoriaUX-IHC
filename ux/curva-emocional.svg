<text x="120.0" y="449" font-size="12" text-anchor="middle" fill="#1d1d1f">ayuda</text>
<text x="120.0" y="470" font-size="11" text-anchor="middle" fill="#7a4b00" font-weight="bold">TP1</text>
<text x="233.8" y="434" font-size="12" text-anchor="middle" fill="#1d1d1f">Busca docente</text>
<text x="233.8" y="449" font-size="12" text-anchor="middle" fill="#1d1d1f">y horario</text>
<text x="233.8" y="470" font-size="11" text-anchor="middle" fill="#7a4b00" font-weight="bold">TP2</text>
<text x="347.5" y="434" font-size="12" text-anchor="middle" fill="#1d1d1f">Elige</text>
<text x="347.5" y="449" font-size="12" text-anchor="middle" fill="#1d1d1f">docente</text>
<text x="347.5" y="470" font-size="11" text-anchor="middle" fill="#7a4b00" font-weight="bold">TP3</text>
<text x="461.2" y="434" font-size="12" text-anchor="middle" fill="#1d1d1f">Elige fecha</text>
<text x="461.2" y="449" font-size="12" text-anchor="middle" fill="#1d1d1f">y hora</text>
<text x="461.2" y="470" font-size="11" text-anchor="middle" fill="#7a4b00" font-weight="bold">TP3 · MC1</text>
<text x="575.0" y="434" font-size="12" text-anchor="middle" fill="#1d1d1f">Escribe</text>
<text x="575.0" y="449" font-size="12" text-anchor="middle" fill="#1d1d1f">sus datos</text>
<text x="575.0" y="470" font-size="11" text-anchor="middle" fill="#7a4b00" font-weight="bold">TP4</text>
